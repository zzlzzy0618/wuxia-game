<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>江湖录 · 武侠RPG v2.1</title>
<style>
  :root{
    --ink:#17171c; --ink2:#22222a;
    --paper:#f2ead8; --paper-dim:#e4d9c0; --paper-dark:#d9cbae;
    --red:#a63a2e; --red-deep:#7d2a20;
    --gold:#b98a44; --gold-dim:#8f6c34;
    --text:#2b2622; --text-dim:#6f6250;
    --jade:#4e7a63; --blue:#3d6f8e;
    --shadow:0 6px 24px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    background-image:
      radial-gradient(1200px 600px at 20% -10%, rgba(185,138,68,.10), transparent 60%),
      radial-gradient(900px 500px at 110% 30%, rgba(166,58,46,.10), transparent 60%),
      radial-gradient(700px 700px at 50% 120%, rgba(78,122,99,.08), transparent 60%);
    color:var(--text);
    font-family:"KaiTi","STKaiti","BiauKai","DFKai-SB","LiSu","SimSun",serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:820px;margin:0 auto;padding:14px 12px 40px;min-height:100%}
  .screen{display:none;animation:fadeIn .35s ease}
  .screen.active{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .panel{
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.015) 0 2px, transparent 2px 4px),
      linear-gradient(160deg, var(--paper), var(--paper-dim));
    border:1px solid var(--paper-dark);
    border-radius:10px;
    box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.35);
    padding:16px;
  }
  .btn{
    font-family:inherit;font-size:15px;cursor:pointer;
    background:linear-gradient(160deg,var(--paper),var(--paper-dim));
    color:var(--text);border:1px solid var(--paper-dark);
    border-radius:8px;padding:8px 12px;letter-spacing:2px;
    box-shadow:0 3px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .08s ease, filter .12s ease;
    user-select:none;
  }
  .btn:hover{filter:brightness(1.05)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
  .btn-primary{background:linear-gradient(160deg,#b7443a,var(--red-deep));color:#f6e9d8;border-color:#6e241b;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .btn-jade{background:linear-gradient(160deg,#527d67,#3c5f4c);color:#eef3ec;border-color:#31513f}
  .btn-gold{background:linear-gradient(160deg,#b98a44,#8f6c34);color:#fff8ea;border-color:#7a5c2a}
  .btn-ghost{background:transparent;color:var(--paper);border-color:#56524a;box-shadow:none}
  .btn-sm{font-size:13px;padding:4px 9px;letter-spacing:1px;border-radius:6px}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--paper-dark),transparent);margin:12px 0}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--gold-dim);color:var(--gold-dim);letter-spacing:1px;margin-left:4px}
  .tag.red{border-color:var(--red);color:var(--red)}
  .tag.jade{border-color:var(--jade);color:var(--jade)}
  .muted{color:var(--text-dim)}
  .gold{color:var(--gold-dim)}
  .jade{color:var(--jade)}
  .red{color:var(--red-deep)}

  #screen-title{padding-top:8vh;text-align:center}
  .title-wrap{position:relative;display:inline-block;margin-bottom:6px}
  .game-title{
    font-size:clamp(58px,15vw,100px);letter-spacing:16px;color:var(--paper);
    text-shadow:0 2px 0 #000, 0 0 40px rgba(185,138,68,.35);
    font-weight:700;
  }
  .seal{
    position:absolute;right:-32px;bottom:6px;
    width:50px;height:50px;background:var(--red);color:#f6e9d8;
    display:flex;align-items:center;justify-content:center;
    font-size:25px;border-radius:6px;transform:rotate(8deg);
    box-shadow:0 4px 14px rgba(0,0,0,.5), inset 0 0 0 2px rgba(246,233,216,.55), inset 0 0 0 5px var(--red);
    line-height:1;text-indent:2px;
  }
  .subtitle{color:var(--paper);opacity:.75;letter-spacing:8px;font-size:17px;margin:6px 0 40px}
  .title-menu{display:flex;flex-direction:column;gap:14px;align-items:center}
  .title-menu .btn{width:240px;font-size:18px;padding:12px}
  .title-foot{margin-top:52px;color:#7c7264;font-size:13px;letter-spacing:2px;line-height:1.9}

  .sect-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
  .sect-card{cursor:pointer;transition:transform .12s ease;position:relative}
  .sect-card:hover{transform:translateY(-2px)}
  .sect-card.selected{outline:3px solid var(--red);outline-offset:-1px}
  .sect-card h3{font-size:19px;letter-spacing:3px}
  .sect-card .passive{color:var(--red);font-size:12.5px;margin:6px 0}
  .sect-card p.desc{font-size:13px;line-height:1.7;color:var(--text-dim)}
  .sect-card ul{margin:8px 0 0 0;padding:0;list-style:none;font-size:12px;color:var(--text-dim)}
  .sect-card ul li{margin:2px 0}
  input.wuxia-input{
    font-family:inherit;font-size:18px;letter-spacing:3px;text-align:center;
    background:rgba(0,0,0,.06);border:none;border-bottom:2px solid var(--gold-dim);
    padding:8px 12px;width:220px;color:var(--text);outline:none;border-radius:6px 6px 0 0;
  }

  .statusbar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-bottom:12px;color:var(--paper)}
  .statusbar .who{font-size:19px;letter-spacing:2px}
  .statusbar .who small{opacity:.7;font-size:12px;margin-left:8px;letter-spacing:1px;display:block}
  .bars{flex:1;min-width:230px;display:flex;flex-direction:column;gap:5px}
  .bar{position:relative;height:16px;background:#0009;border:1px solid #ffffff26;border-radius:99px;overflow:hidden}
  .bar i{position:absolute;left:6px;top:0;bottom:0;display:flex;align-items:center;font-size:11px;font-style:normal;color:#fffbe9;text-shadow:0 1px 2px #000;letter-spacing:1px;z-index:2}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;transition:width .4s ease}
  .bar.hp .fill{background:linear-gradient(90deg,#c04a3c,#d97757)}
  .bar.mp .fill{background:linear-gradient(90deg,#3d6f8e,#63a3a0)}
  .bar.xp{height:10px}
  .bar.xp .fill{background:linear-gradient(90deg,#8f6c34,#cfa257)}
  .silver-line{font-size:14px;color:var(--gold);letter-spacing:1px}
  .title-line{font-size:13px;color:var(--paper);opacity:.85;letter-spacing:1px}

  .loc-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .loc-head h2{font-size:24px;letter-spacing:4px}
  .loc-head .sub{color:var(--text-dim);letter-spacing:2px;font-size:13px}
  .loc-desc{color:var(--text-dim);margin-top:6px;line-height:1.8;font-size:14px}
  .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin-top:14px}
  .actions .btn{padding:8px 4px;font-size:14px}
  .actions .grp{grid-column:1/-1;font-size:11.5px;letter-spacing:4px;color:var(--text-dim);border-bottom:1px dashed #00000022;padding-bottom:3px;margin-top:2px}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;margin:8px 0 4px}
  .stat-cell{background:rgba(0,0,0,.05);border:1px solid var(--paper-dark);border-radius:8px;padding:8px 10px;text-align:center;line-height:1.5}
  .stat-cell span{display:block;font-size:11.5px;letter-spacing:3px;color:var(--text-dim)}
  .stat-cell b{display:block;font-size:19px;letter-spacing:1px;margin-top:2px}
  .stat-cell b.small{font-size:14.5px;line-height:1.5}
  .stat-cell em{display:block;font-style:normal;font-size:11px;color:var(--jade);letter-spacing:1px;margin-top:2px}
  .fx-line{font-size:13.5px;color:var(--jade);letter-spacing:1px}
  .move-row{display:flex;align-items:baseline;gap:7px;padding:3px 0;font-size:13px;border-bottom:1px dashed #00000012;flex-wrap:wrap}
  .move-row:last-child{border-bottom:none}
  .move-row.locked{opacity:.48}
  .move-row .mno{font-size:11px;color:var(--gold-dim);letter-spacing:1px;white-space:nowrap}
  .move-row .mfx{color:var(--text-dim);font-size:12.5px}
  .mtag{font-size:10.5px;padding:0 7px;border-radius:99px;letter-spacing:1px;border:1px solid}
  .mtag.act{color:var(--red);border-color:var(--red)}
  .mtag.pas{color:var(--jade);border-color:var(--jade)}
  .quest-box{margin-top:14px;border-left:4px solid var(--red);padding:8px 12px;background:rgba(166,58,46,.07);border-radius:0 8px 8px 0;font-size:14px;line-height:1.8}
  .comp-strip{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .comp-chip{
    display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.06);
    border:1px solid var(--paper-dark);border-radius:8px;padding:5px 10px;font-size:13px;
  }
  .comp-chip b{letter-spacing:1px}
  .comp-chip .role{font-size:11px;color:var(--paper);border-radius:4px;padding:1px 6px;letter-spacing:1px}
  .comp-chip .role.r-atk{background:var(--red)}
  .comp-chip .role.r-heal{background:var(--jade)}
  .comp-chip .role.r-sup{background:var(--blue)}
  .comp-chip .role.r-tank{background:#6b5b46}
  #log{margin-top:14px;max-height:210px;overflow-y:auto;font-size:14px;line-height:1.9;padding:4px 8px}
  #log p{border-bottom:1px dashed #00000014;padding:3px 0}
  #log p.good{color:var(--jade)}
  #log p.bad{color:var(--red-deep)}
  #log p.sys{color:var(--gold-dim)}

  .battle-stage{position:relative;padding:18px 12px 14px;text-align:center;overflow:hidden}
  .enemy-name{font-size:22px;letter-spacing:3px}
  .enemy-flavor{color:var(--text-dim);font-size:12.5px;margin-top:2px;letter-spacing:1px}
  .enemy-hp-wrap{max-width:380px;margin:10px auto 0}
  .vs{ text-align:center;color:#8b7f6b;letter-spacing:6px;font-size:13px;margin:10px 0}
  .float-dmg{
    position:absolute;font-size:26px;font-weight:700;color:#e4574a;text-shadow:0 2px 0 #000,0 0 12px rgba(228,87,74,.6);
    pointer-events:none;animation:floatUp 1s ease forwards;letter-spacing:1px;z-index:5;
  }
  .float-dmg.crit{font-size:34px;color:#ffb347}
  .float-dmg.heal{color:#6fbf8f}
  .float-dmg.miss{color:#a9a094;font-size:20px}
  .float-dmg.ally{color:#7fa8d9}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-64px) scale(1)}}
  .shake{animation:shake .35s ease}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  #battle-log{max-height:150px;overflow-y:auto;font-size:14px;line-height:1.85;padding:2px 10px}
  #battle-log p{border-bottom:1px dashed #00000012;padding:2px 0}
  #battle-log p.good{color:var(--jade)}
  #battle-log p.bad{color:var(--red-deep)}
  #battle-log p.sys{color:var(--gold-dim)}
  #battle-log p.ally{color:var(--blue)}
  .skill-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
  .skill-btns .btn{font-size:14px;padding:7px 6px;letter-spacing:1px}
  .skill-btns .btn small{display:block;font-size:11px;opacity:.7;letter-spacing:0;margin-top:2px}

  #modal-root{position:fixed;inset:0;display:none;z-index:50}
  #modal-root.show{display:flex;align-items:center;justify-content:center;padding:16px}
  #modal-root .overlay{position:absolute;inset:0;background:rgba(8,8,10,.72);backdrop-filter:blur(2px)}
  .modal{
    position:relative;width:min(600px,94vw);max-height:86vh;overflow-y:auto;
    animation:popIn .25s ease;
  }
  @keyframes popIn{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
  .modal h2{font-size:21px;letter-spacing:4px;margin-bottom:4px}
  .modal .hr{height:2px;background:linear-gradient(90deg,var(--red),transparent);margin:8px 0 14px;border:none}
  .modal .body{font-size:14.5px;line-height:1.95}
  .modal .foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
  .list-row{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px dashed #00000018;font-size:14px;flex-wrap:wrap}
  .list-row .grow{flex:1;line-height:1.55;min-width:150px}
  .list-row .grow b{letter-spacing:1px}
  .list-row .grow small{display:block;color:var(--text-dim);font-size:12px}
  .list-row .equipped{outline:2px solid var(--jade);outline-offset:-2px;border-radius:6px}
  .toast{
    position:fixed;left:50%;bottom:38px;transform:translateX(-50%);
    background:var(--ink2);color:var(--paper);border:1px solid #ffffff2a;
    padding:9px 22px;border-radius:99px;letter-spacing:2px;font-size:15px;z-index:99;
    box-shadow:var(--shadow);animation:toastIn .25s ease;max-width:88vw;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

  .mute-btn{position:fixed;top:12px;right:14px;z-index:40;width:38px;height:38px;border-radius:50%;padding:0;font-size:17px;display:flex;align-items:center;justify-content:center}
  .ending-body{line-height:2.1;font-size:15px;text-align:justify}
  .forge-star{color:var(--gold-dim);letter-spacing:1px}
  .bounty-row .grow b{color:var(--red-deep)}
  @media (max-width:560px){
    .game-title{letter-spacing:10px}
    .statusbar .who{width:100%}
  }
</style>
</head>
<body>
<button class="btn btn-ghost mute-btn" id="mute-btn" title="音效开关">♪</button>
<div id="app">

  <div id="screen-title" class="screen active">
    <div class="title-wrap">
      <div class="game-title">江湖录</div>
      <div class="seal">俠</div>
    </div>
    <div class="subtitle">仗 剑 江 湖 载 酒 行</div>
    <div class="title-menu">
      <button class="btn btn-primary" id="btn-new">初入江湖</button>
      <button class="btn" id="btn-continue" style="display:none">重出江湖</button>
      <button class="btn" id="btn-about">关于此书</button>
    </div>
    <div class="title-foot">致敬金庸 · 古龙 武侠世界 · 豪华版<br>十大门派 · 二百武学三系千招 · 三百珍品 · 五十五处江湖 · 伙伴同行<br>悬赏 · 锻造 · 比武大会 · 称号 · 隐世奇遇<br>同人练手之作 · 纯前端单文件 · 无需安装</div>
  </div>

  <div id="screen-create" class="screen">
    <div class="panel">
      <h2 style="letter-spacing:4px">拜师入门</h2>
      <hr class="hr" style="height:2px;background:linear-gradient(90deg,var(--red),transparent);margin:8px 0 16px;border:none">
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <span style="letter-spacing:2px">侠名：</span>
        <input class="wuxia-input" id="name-input" maxlength="12" placeholder="无名侠客">
      </div>
      <div class="sect-grid" id="sect-grid"></div>
      <div style="margin-top:18px;text-align:center">
        <button class="btn btn-primary" id="btn-start" style="font-size:18px;padding:11px 44px;letter-spacing:6px">出 峡 谷 · 入 江 湖</button>
      </div>
    </div>
  </div>

  <div id="screen-home" class="screen">
    <div class="statusbar">
      <div class="who" id="sb-name"></div>
      <div class="bars">
        <div class="bar hp"><i id="sb-hp-t"></i><div class="fill" id="sb-hp-f"></div></div>
        <div class="bar mp"><i id="sb-mp-t"></i><div class="fill" id="sb-mp-f"></div></div>
        <div class="bar xp"><i></i><div class="fill" id="sb-xp-f"></div></div>
      </div>
      <div class="silver-line" id="sb-silver"></div>
      <div class="title-line" id="sb-title"></div>
    </div>

    <div class="panel" id="loc-panel">
      <div class="loc-head"><h2 id="loc-name"></h2><span class="sub" id="loc-sub"></span></div>
      <div class="loc-desc" id="loc-desc"></div>
      <div class="actions">
        <div class="grp">— 历 练 —</div>
        <button class="btn btn-primary" id="btn-explore">探 索</button>
        <button class="btn btn-primary" id="btn-boss" style="display:none"></button>
        <div class="grp">— 人 物 —</div>
        <button class="btn" id="btn-skills">武 学</button>
        <button class="btn" id="btn-stats">属 性</button>
        <button class="btn" id="btn-bag">行 囊</button>
        <button class="btn" id="btn-companions">伙 伴</button>
        <div class="grp">— 江 湖 —</div>
        <button class="btn" id="btn-travel">江湖舆图</button>
        <button class="btn btn-gold" id="btn-bounty">悬赏榜</button>
        <button class="btn btn-jade" id="btn-tournament">比武大会</button>
        <button class="btn btn-gold" id="btn-forge">锻 造</button>
        <button class="btn" id="btn-titles">称 号</button>
        <div class="grp">— 休 整 —</div>
        <button class="btn" id="btn-shop">飞鸽购药</button>
        <button class="btn" id="btn-rest">客栈歇息</button>
        <button class="btn" id="btn-train">打坐修炼</button>
      </div>
      <div class="comp-strip" id="comp-strip"></div>
      <div class="quest-box" id="quest-box"></div>
    </div>

    <div class="panel" style="margin-top:12px">
      <div style="letter-spacing:3px;color:var(--text-dim);font-size:14px;margin-bottom:4px">— 江湖见闻 —</div>
      <div id="log"></div>
    </div>
  </div>

  <div id="screen-battle" class="screen">
    <div class="panel battle-stage" id="battle-stage">
      <div class="enemy-name" id="en-name"></div>
      <div class="enemy-flavor" id="en-flavor"></div>
      <div class="enemy-hp-wrap">
        <div class="bar hp"><i id="en-hp-t"></i><div class="fill" id="en-hp-f"></div></div>
      </div>
    </div>
    <div class="vs">— 你与同伴 —</div>
    <div class="panel" style="margin-top:2px">
      <div id="bt-comps" class="comp-strip" style="margin-bottom:8px"></div>
      <div class="bars" style="margin-bottom:10px">
        <div class="bar hp"><i id="bt-hp-t"></i><div class="fill" id="bt-hp-f"></div></div>
        <div class="bar mp"><i id="bt-mp-t"></i><div class="fill" id="bt-mp-f"></div></div>
      </div>
      <div id="battle-log"></div>
      <div class="skill-btns" id="battle-actions"></div>
    </div>
  </div>
</div>

<div id="modal-root"><div class="overlay"></div></div>

<script>
'use strict';
/* ============ 江湖录 v2 · 核心工具 & 音效 ============ */
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rf = (a, b) => Math.random() * (b - a) + a;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));
const pick = arr => arr[rnd(0, arr.length - 1)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtPct = v => Math.round(v * 100) + '%';

const Sfx = {
  ctx: null, muted: false,
  ensure() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  tone(f, dur, type = 'square', vol = .12, delay = 0, slide = 0) {
    if (this.muted || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t0); o.stop(t0 + dur + .05);
  },
  click() { this.tone(660, .05, 'triangle', .08); },

function boss(name, lv, o = {}) {
  return Object.assign({
    name, lv,
    hpMul: 4 + lv * .12, atkMul: 1.5 + lv * .004,
    expMul: 3, silMul: 5, skills: [], reward: {}
  }, o);
}

  const out = [];
  let i = 0;
  while (out.length < n && i < 40) { const v = list[(seed + i * 7) % list.length]; if (!out.includes(v)) out.push(v); i++; }
  return out;
}

function r1(x) { return Math.round(x * 10) / 10; }

// 探测武学兵器类型（决定套路招式名池）
function skillTypeOf(name) {
  const keys = ['剑', '刀', '拳', '掌', '指', '腿', '棍', '杖', '针', '石', '箭', '袖', '手', '铃'];
  for (const k of keys) if (name.includes(k)) return k;
  return '通用';
}

// 生成被动招式
function mkPas(cat, seed, lv, boost = 1) {
  let key;
  if (cat === 'rt') {
    key = pickBy(['atk', 'crt', 'atkp', 'ls'], seed);
  } else if (cat === 'in') {
    key = pickBy(['hp', 'mp', 'def', 'regen', 'mpregen'], seed);
  } else {
    key = pickBy(['spd', 'dodge', 'crt'], seed);
  }
  let v = PAS_VAL[key](lv);
  if (boost !== 1) v = key === 'firstCrit' ? v : Math.round(v * boost * 10) / 10;
  return { t: 'pas', fx: { [key]: v } };
}

// 生成五式招法
// rt: 一二四五式为主动（绝招带终结特性），三式为被动
// in: 二式为主动（运功疗伤 / 吞纳真气），其余四式为被动（五式最强）
// ag: 三式为主动（凌空迅击），其余四式为被动（五式最强）
function genMoves(sk) {
  const fx = sk.fx || {}, lv = sk.lv, h = seedHash(sk.id);
  const moves = [];

  if (sk.cat === 'rt') {
    const names = SIGNATURE_MOVES[sk.id] || MOVE_POOLS[skillTypeOf(sk.name)] || MOVE_POOLS.通用;
    // 特性分配：攻击 hint 按序分给 二式 / 四式 / 五式
    const hints = [];
    ['hits', 'critBonus', 'dot', 'lifesteal', 'mpDrain', 'defBuff', 'atkBuff', 'hpCost', 'stun', 'ignoreDef', 'mustHit', 'mustCrit']
      .forEach(k => { if (fx[k]) hints.push([k, fx[k]]); });
    const take = slots => {
      const o = {};
      slots.forEach(idx => { if (hints[idx]) o[hints[idx][0]] = hints[idx][1]; });
      return o;
    };
    moves.push(Object.assign({ name: names[0], t: 'act', mult: r1(sk.mult * MV_MULT[0]), mp: Math.round(sk.mp * MV_MP[0]) }));
    moves.push(Object.assign({ name: names[1], t: 'act', mult: r1(sk.mult * MV_MULT[1]), mp: Math.round(sk.mp * MV_MP[1]) }, take([0])));
    moves.push(Object.assign({ name: names[2], t: 'pas' }, mkPas('rt', h + 3, lv)));
    moves.push(Object.assign({ name: names[3], t: 'act', mult: r1(sk.mult * MV_MULT[3]), mp: Math.round(sk.mp * MV_MP[3]) }, take([1])));
    const fin = Object.assign({ name: names[4], t: 'act', mult: r1(sk.mult * MV_MULT[4]), mp: Math.round(sk.mp * MV_MP[4]) }, take([2, 3]));
    if (!fin.mustCrit && !fin.ignoreDef && !fin.mustHit && !fin.stun) fin.critBonus = 8;
    moves.push(fin);
  } else if (sk.cat === 'in') {
    const sig = SIGNATURE_MOVES[sk.id];
    const pn = i => sig ? sig[i] : PAS_POOLS.in[(h + i * 11) % PAS_POOLS.in.length];
    moves.push(Object.assign({ name: pn(0) }, mkPas('in', h, lv)));
    if (fx.drain) {
      moves.push({ name: sig ? sig[1] : '吞纳真气', t: 'act', mult: r1(sk.mult * .75), mpDrain: Math.round(12 + lv * 1.2), mp: Math.round(sk.mp * .8) });
    } else {
      moves.push({ name: '运功疗伤', t: 'act', mult: 0, heal: Math.round((.14 + lv * .005) * 1000) / 1000, healMp: Math.round((.08 + lv * .003) * 1000) / 1000, mp: Math.round(sk.mp * .9) });
    }
    moves.push(Object.assign({ name: pn(2) }, mkPas('in', h + 11, lv)));
    moves.push(Object.assign({ name: pn(3) }, mkPas('in', h + 29, lv)));
    // 五式 · 神功大成：最强被动（伤害减免 / 气血上限百分比 / 回气），×1.3
    const strongKey = pickBy(['dmgred', 'hppct', 'regen', 'hp'], h + 7);
    const strong = { t: 'pas', fx: {} };
    strong.fx[strongKey] = Math.round(PAS_VAL[strongKey](lv) * 1.3 * 10) / 10;
    moves.push(Object.assign({ name: sig ? sig[4] : '神功大成' }, strong));
  } else {
    const sig = SIGNATURE_MOVES[sk.id];
    const pn = i => sig ? sig[i] : PAS_POOLS.ag[(h + i * 11) % PAS_POOLS.ag.length];
    moves.push(Object.assign({ name: pn(0) }, mkPas('ag', h, lv)));
    moves.push(Object.assign({ name: pn(1) }, mkPas('ag', h + 11, lv)));
    const swift = { name: sig ? sig[2] : '凌空一击', t: 'act', mult: r1(sk.mult * .9), hits: 2, mp: Math.round(sk.mp * .7) };
    if (fx.mustHit) swift.mustHit = 1;
    moves.push(swift);
    moves.push(Object.assign({ name: pn(3) }, mkPas('ag', h + 29, lv)));
    // 五式 · 绝顶轻功：高阶（23级+）附带「首击必暴」，否则大幅身法/闪避
    const fin = { name: sig ? sig[4] : '轻功大成', t: 'pas', fx: {} };
    if (lv >= 23 && (h % 2 === 0)) fin.fx.firstCrit = 1;
    else {
      const k = pickBy(['spd', 'dodge'], h + 7);
      fin.fx[k] = Math.round(PAS_VAL[k](lv) * 1.4 * 10) / 10;
    }
    moves.push(fin);
  }
  moves.forEach((m, i) => { m.mv = i + 1; m.unlock = sk.lv + MV_UNLOCK[i]; });
  return moves;
}

function moveFxDesc(m) {
  if (m.t === 'pas') {
    const D = {
      atk: v => `攻击 +${v}`, crt: v => `暴击 +${v}%`, atkp: v => `攻击 +${v}%`, ls: v => `攻击吸血 ${v}%`,
      hp: v => `气血上限 +${v}`, mp: v => `内力上限 +${v}`, def: v => `防御 +${v}`,
      regen: v => `每回合回复 ${v}% 气血`, mpregen: v => `每回合回复内力 +${v}`,
      dmgred: v => `受到伤害 -${v}%`, hppct: v => `气血上限 +${v}%`,
      spd: v => `身法 +${v}`, dodge: v => `闪避 +${v}%`, firstCrit: () => '每战首次出手必定会心'
    };
    return Object.entries(m.fx).map(([k, v]) => D[k] ? D[k](v) : k).join('，');
  }
  const parts = [];
  if (m.heal) parts.push(`回复${Math.round(m.heal * 100)}%气血${m.healMp ? `、${Math.round(m.healMp * 100)}%内力` : ''}`);
  if (m.hits > 1) parts.push(m.hits + '连击');
  if (m.critBonus) parts.push('暴击+' + m.critBonus + '%');
  if (m.mustHit) parts.push('必中');
  if (m.mustCrit) parts.push('必暴击');
  if (m.ignoreDef) parts.push('无视防御');
  if (m.stun) parts.push('震慑几率' + Math.round(m.stun * 100) + '%');
  if (m.lifesteal) parts.push('吸取' + Math.round(m.lifesteal * 100) + '%伤害为气血');
  if (m.mpDrain) parts.push('吸取内力' + m.mpDrain);
  if (m.defBuff) parts.push('护体' + m.defBuff + '回合');
  if (m.atkBuff) parts.push('增攻' + m.atkBuff + '回合');
  if (m.hpCost) parts.push('自损' + Math.round(m.hpCost * 100) + '%气血');
  if (m.dot) parts.push('施毒(每回合' + Math.round(m.dot * 100) + '%攻击)');
  return parts.join('，') || '寻常招式';
}

// SKILLS: id -> {id, name, cat, lv, mp, mult, kind, sect, moves[5], desc}
GEN.buildSkills = function () {
  const S = {
    basic: { id: 'basic', name: '普通攻击', cat: 'rt', mp: 0, mult: 1.0, lv: 1, kind: 'basic', moves: null, desc: '拳脚兵刃招呼，不耗内力。' }
  };
  const build = (id, name, cat, t, fx, kind, sect) => {
    const sk = {
      id, name, cat, kind, sect: sect || null,
      lv: t.lv, mp: t.mp,
      mult: Math.round(t.mult * ((fx && fx.mult) || 1) * 100) / 100,
      fx: fx || {}
    };
    sk.moves = genMoves(sk);
    const bestAct = sk.moves.filter(m => m.t === 'act' && m.mult > 0).reduce((a, b) => (b.mult * (b.hits || 1)) > (a.mult * (a.hits || 1)) ? b : a, { mult: 0, hits: 1 });
    sk.desc = cat === 'in'
      ? `内功心法——五式招法，蕴养生克敌之妙。`
      : cat === 'ag'
        ? `轻功身法——身轻如燕，来去如风。`
        : `套路武学——绝招「${bestAct.name}」威力 ${Math.round(bestAct.mult * (bestAct.hits || 1) * 100) / 100} 倍。`;
    return sk;
  };
  // 门派武学（按槽位序列分类）
  Object.entries(SECTS).forEach(([sectId, sect]) => {
    sect.skills.forEach((def, i) => {
      const [name, fx] = def;
      const id = sectId + '_s' + i;
      S[id] = build(id, name, SECT_SKILL_CATS[i], SKILL_TIERS[i], fx || {}, 'sect', sectId);
    });
  });
  // 通用武学（秘籍）
  UNIVERSAL_SKILLS.forEach((def, i) => {
    const [name, fx] = def;
    const t = SKILL_TIERS[Math.min(i * 2, 14)];
    S['univ' + i] = build('univ' + i, name, fx.cat, t, fx, 'univ');
  });
  // 隐世武学
  Object.entries(HIDDEN_SKILLS).forEach(([id, def]) => {
    const [name, fx] = def;
    const t = SKILL_TIERS[13];
    S[id] = build(id, name, fx.cat, { lv: fx.lv || t.lv, mult: t.mult, mp: t.mp }, fx, 'hidden');
  });
  return S;
};

function equippedSkillIds() {

function moveUnlocked(m) { return P.lv >= m.unlock; }

// 武学当前战力评估：套路取已解锁的最强主动招，内功/轻功按招式参悟进度折算
// （如此，早年武学五式大成之前，不会被刚入门的高阶新武学轻易顶替）
function skillPower(id) {
  const sk = SKILLS[id];
  if (!sk) return 0;
  if (sk.cat === 'rt') {
    let best = 0;
    sk.moves.forEach(m => {
      if (m.t === 'act' && m.mult > 0 && moveUnlocked(m)) best = Math.max(best, m.mult * (m.hits || 1));
    });
    return best || sk.mult * .8;
  }
  const un = sk.moves.filter(moveUnlocked).length;
  return Math.round(sk.mult * (.35 + .65 * un / 5) * 100) / 100;
}

function autoEquip(id) {
  const sk = SKILLS[id];
  if (!sk || id === 'basic') return null;
  if ([P.rtSkill, P.rtSkill2, P.inSkill, P.agSkill].includes(id)) return null;
  if (sk.cat === 'rt') {
    if (!P.rtSkill) { P.rtSkill = id; return '主套路'; }
    if (!P.rtSkill2) { P.rtSkill2 = id; return '副套路'; }
    const weak = skillPower(P.rtSkill) <= skillPower(P.rtSkill2) ? 'rtSkill' : 'rtSkill2';
    if (skillPower(P[weak]) < skillPower(id)) { P[weak] = id; return SLOT_LABEL[weak]; }
  } else if (sk.cat === 'in') {
    if (!P.inSkill) { P.inSkill = id; return '内功'; }
    if (skillPower(P.inSkill) < skillPower(id)) { P.inSkill = id; return '内功'; }
  } else {
    if (!P.agSkill) { P.agSkill = id; return '轻功'; }
    if (skillPower(P.agSkill) < skillPower(id)) { P.agSkill = id; return '轻功'; }
  }
  return null;
}
// 习得武学并尝试自动运功
function grantSkill(id) {
  if (!P.skills.includes(id)) P.skills.push(id);
  return autoEquip(id);
}
// 手动运功（武学界面）：直接装入对应系槽位，套路双槽时顶掉较弱一门
function forceEquip(id) {
  const sk = SKILLS[id];
  if (!sk || id === 'basic') return null;
  if (sk.cat === 'rt') {
    if (!P.rtSkill) { P.rtSkill = id; return '主套路'; }
    if (!P.rtSkill2) { P.rtSkill2 = id; return '副套路'; }
    const weak = skillPower(P.rtSkill) <= skillPower(P.rtSkill2) ? 'rtSkill' : 'rtSkill2';
    P[weak] = id; return SLOT_LABEL[weak];
  }
  const key = sk.cat === 'in' ? 'inSkill' : 'agSkill';
  P[key] = id; return SLOT_LABEL[key];
}
// 升级后重估运功：招式随等级解锁，早年武学可能反超高阶新学；返回变动说明
function reevaluateSlots() {
  const changed = [];
  P.skills.forEach(id => {
    const slot = autoEquip(id);
    if (slot) changed.push(`真气流转，你重新运功——「<b>${SKILLS[id].name}</b>」荣升${slot}之位！`);
  });
  return changed;
}

// —— 属性计算 ——
function recompute() {
  const s = SECTS[P.sect], g = P.lv - 1, tf = curTitleFx(), b = P.bonus;
  let hp = s.base.hp + s.grow.hp * g + (b.hp || 0) + (tf.hp || 0);
  let mp = s.base.mp + s.grow.mp * g + (b.mp || 0) + (tf.mp || 0);
  let atk = s.base.atk + s.grow.atk * g + (b.atk || 0) + (tf.atk || 0);
  let def = s.base.def + s.grow.def * g + (b.def || 0) + (tf.def || 0);
  let spd = s.base.spd + s.grow.spd * g + (b.spd || 0) + (tf.spd || 0);
  let crt = s.base.crt + s.grow.crt * g + (b.crt || 0) + (tf.crt || 0);
  let atkp = 0, regen = 0, mpregen = 0, dmgred = 0, hppct = 0, dodge = 0, ls = 0, firstCrit = false;

  // 装备中的武学：已参悟的被动招式生效
  equippedSkillIds().forEach(id => {
    SKILLS[id].moves.forEach(m => {
      if (m.t !== 'pas' || !moveUnlocked(m) || !m.fx) return;
      const f = m.fx;
      if (f.atk) atk += f.atk;
      if (f.crt) crt += f.crt;
      if (f.def) def += f.def;
      if (f.spd) spd += f.spd;
      if (f.hp) hp += f.hp;
      if (f.mp) mp += f.mp;
      if (f.atkp) atkp += f.atkp;
      if (f.ls) ls += f.ls;
      if (f.regen) regen += f.regen;
      if (f.mpregen) mpregen += f.mpregen;
      if (f.dmgred) dmgred += f.dmgred;
      if (f.hppct) hppct += f.hppct;
      if (f.dodge) dodge += f.dodge;
      if (f.firstCrit) firstCrit = true;
    });
  });

  const w = P.weapon && ITEMS[P.weapon];
  if (w) atk += w.atk + forgeAdd(w.atk, w.id);
  const a = P.armor && ITEMS[P.armor];
  if (a) def += a.def + forgeAdd(a.def, a.id);
  const ac = P.acc && ITEMS[P.acc];
  if (ac) {
    const v = ac.fxv + forgeAdd(ac.fxv, ac.id);
    switch (ac.fx) {
      case 'hp': hp += v * 3; break;
      case 'mp': mp += v * 2; break;
      case 'atk': atk += v; break;
      case 'def': def += v; break;
      case 'crt': crt += v; break;
      case 'spd': spd += v; break;
      case 'regen': regen += v; break;
      case 'atkp': atkp += v; break;
      case 'atkspd': atk += v; spd += v; break;
      case 'spdcrt': spd += v; crt += v; break;
      case 'defspd': def += v; spd += v; break;
      case 'hpmp': hp += v * 2; mp += v; break;
    }
  }
  if (hppct) hp *= 1 + hppct / 100;
  if (s.passive.id === 'royal') hp = Math.round(hp * 1.1);  // 大理：气血上限+10%
  if (atkp) atk = Math.round(atk * (1 + atkp / 100));

  P.hpMax = Math.round(hp); P.mpMax = Math.round(mp);
  P.atk = Math.round(atk); P.def = Math.round(def);
  P.spd = Math.round(spd); P.crt = Math.round(crt);
  P.regen = Math.round(Math.min(regen, 12) * 10) / 10;
  P.mpregen = Math.round(mpregen);
  P.dmgred = Math.round(Math.min(dmgred, 35) * 10) / 10;
  P.dodgeBonus = Math.round(Math.min(dodge, 20) * 10) / 10;
  P.ls = Math.round(Math.min(ls, 35) * 10) / 10;
  P.firstCrit = firstCrit;
  P.hp = clamp(P.hp, 0, P.hpMax);
  P.mp = clamp(P.mp, 0, P.mpMax);
}

// —— 存档 ——
function save() {
  if (!P) return;
  flags.loc = curMap;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, p: P, flags })); } catch (e) {}
}
function loadSave() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (d && d.v === 2 && d.p && d.flags) return d;
  } catch (e) {}
  return null;
}

// —— 行囊工具 ——
function addItem(id, n = 1) { P.bag[id] = (P.bag[id] || 0) + n; }
function removeItem(id, n = 1) {
  if (!P.bag[id]) return false;
  P.bag[id] -= n;
  if (P.bag[id] <= 0) delete P.bag[id];
  return true;
}
function countMat(tier) {
  let n = 0;
  Object.entries(P.bag).forEach(([id, c]) => {
    const it = ITEMS[id];
    if (it && it.cat === 'mat' && it.mtier === tier) n += c;
  });
  return n;
}
function consumeMat(tier, n) {
  for (const [id, c] of Object.entries(P.bag)) {
    const it = ITEMS[id];
    if (n <= 0) break;
    if (it && it.cat === 'mat' && it.mtier === tier) {
      const take = Math.min(c, n);
      removeItem(id, take);
      n -= take;
    }
  }
  return n <= 0;
}

// —— 伙伴加成判断 ——
function hasComp(id) { return P && P.comps.includes(id); }
function hasPerk(perk) {
  return P && P.compActive.some(id => COMPANIONS[id] && COMPANIONS[id].perk === perk);
}

// —— 称号检查（在各关键节点调用）——
// 加成强度评分：更强的称号才会自动佩戴，避免静默降级
function titleScore(id) {
  const fx = (TITLES[id] && TITLES[id].fx) || {};
  return (fx.atk || 0) + (fx.def || 0) + (fx.spd || 0) + (fx.crt || 0) + (fx.hp || 0) * .04 + (fx.mp || 0) * .1;
}
function checkTitles() {
  if (!P) return;
  const conds = {
    lv10: P.lv >= 10, lv20: P.lv >= 20, lv30: P.lv >= 30, lv40: P.lv >= 40, lv50: P.lv >= 50,
    kill100: P.kills >= 100, kill500: P.kills >= 500,
    boss10: P.bossKills >= 10, bossAll: flags.ch >= 11,
    forge5: P.forgeSucc >= 5, forge10: P.forgeSucc >= 10,
    tour1: P.tourWins >= 1, tour3: P.tourWins >= 3,
    bounty20: flags.bountyCount >= 20,
    rich: P.silver >= 50000
  };
  const gained = [];
  Object.entries(conds).forEach(([id, ok]) => {
    if (ok && !P.titles.includes(id)) { P.titles.push(id); gained.push(id); }
  });
  if (gained.length) {
    gained.forEach(id => {
      const t = TITLES[id];
      const fxTxt = Object.entries(t.fx).map(([k, v]) =>
        ({ hp: '气血', mp: '内力', atk: '攻击', def: '防御', spd: '身法', crt: '暴击%' }[k] || k) + '+' + v).join('，');
      const auto = titleScore(id) > titleScore(P.title);
      if (auto) P.title = id;
      modal('称号 · ' + t.name,
        `<p>江湖中人送你一个名号——<b style="color:var(--red)">${t.name}</b>。</p>
         <p class="muted">${t.how}。佩戴称号：${fxTxt || '无加成'}。</p>
         <p class="muted">${auto ? '加成更胜从前，已自动佩戴。' : '当前仍佩戴「' + TITLES[P.title].name + '」，可在「称号」中更换。'}</p>`,
        [{ label: '不负此名', primary: true }]);
    });
    recompute();
    save();
  }
}
/* ============ 战斗引擎（玩家 + 伙伴 vs 敌人） ============ */

const passiveId = () => SECTS[P.sect].passive.id;

function mkCompInstance(id) {
  const c = COMPANIONS[id];
  const M = { atk: [1.15, .95], tank: [.65, 1.85], heal: [.55, 1.05], sup: [.62, 1.05] }[c.role];
  const hpMax = Math.round((40 + P.lv * 17) * M[1]);
  return {
    id, role: c.role, skill: c.skill,
    name: c.name.split(' · ')[1] || c.name,
    hpMax, hp: hpMax,
    atk: Math.round((5 + P.lv * 2.5) * M[0])
  };
}

function startBattle(enemyTpl, opts = {}) {
  const e = JSON.parse(JSON.stringify(enemyTpl));
  e.hp = e.hpMax;
  B = {
    e,
    bossId: opts.bossId || null,
    bountyKey: opts.bountyKey || null,
    tournament: !!opts.tournament,
    noFlee: !!opts.bossId || !!opts.tournament,
    comps: (P.compActive || []).map(mkCompInstance),
    defBuffTurns: 0, atkBuffTurns: 0, cover: false,
    enemyStun: false, dot: null,
    bf: { atk: 0, def: 0, spd: 0, nextCrit: false, dodge: false },
    firstCrit: passiveId() === 'firstcrit' || !!P.firstCrit,
    busy: false, round: 0
  };
  if (passiveId() === 'opening') {
    if (Math.random() < .5) { B.atkBuffTurns = 3; } else { B.defBuffTurns = 3; }
  }
  $('#battle-log').innerHTML = '';
  $('#en-name').textContent = `${e.name} · ${e.lv}级`;
  $('#en-flavor').textContent = e.flavor || '';
  show('#screen-battle');
  blog(`狭路相逢！<b>${e.name}</b>${B.noFlee ? '挡在你面前，杀气冲天！' : '向你扑来！'}`, 'sys');
  renderBattle();
  renderBattleActions();
}

function renderBattle() {
  const e = B.e;
  $('#en-hp-t').textContent = `${e.name} ${e.hp} / ${e.hpMax}`;
  $('#en-hp-f').style.width = clamp(e.hp / e.hpMax * 100, 0, 100) + '%';
  $('#bt-hp-t').textContent = `气血 ${P.hp} / ${P.hpMax}`;
  $('#bt-mp-t').textContent = `内力 ${P.mp} / ${P.mpMax}`;
  $('#bt-hp-f').style.width = clamp(P.hp / P.hpMax * 100, 0, 100) + '%';
  $('#bt-mp-f').style.width = clamp(P.mp / P.mpMax * 100, 0, 100) + '%';
  const cs = B.comps.map(c => {
    if (c.hp <= 0) return `<span class="comp-chip" style="opacity:.4">${c.name}（退下）</span>`;
    const pct = Math.round(c.hp / c.hpMax * 100);
    const col = pct > 50 ? 'var(--jade)' : pct > 25 ? 'var(--gold-dim)' : 'var(--red)';
    return `<span class="comp-chip"><b>${c.name}</b><span style="color:${col}">${pct}%</span></span>`;
  }).join('');
  $('#bt-comps').innerHTML = cs ? cs : '<span class="muted" style="font-size:13px">孤身赴敌，无同伴随行</span>';
}

function floatDmg(target, text, cls = '') {
  const stage = $('#battle-stage');
  const span = document.createElement('span');
  span.className = 'float-dmg ' + cls;
  span.textContent = text;
  span.style.left = (target === 'enemy' ? 50 + rnd(-30, 30) : 50 + rnd(-20, 20)) + '%';
  span.style.top = (target === 'enemy' ? rnd(20, 60) : rnd(70, 110)) + 'px';
  stage.appendChild(span);
  setTimeout(() => span.remove(), 1000);
}
function shakePanel(sel) {
  const el = $(sel);
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

function renderBattleActions() {
  const box = $('#battle-actions');
  const btns = [`<button class="btn btn-primary" data-skl="basic" data-mvi="0">普通攻击<small>不耗内力 · 拳脚兵刃招呼</small></button>`];
  [P.rtSkill, P.rtSkill2, P.inSkill, P.agSkill].forEach(id => {
    if (!id || !SKILLS[id]) return;
    const sk = SKILLS[id];
    sk.moves.forEach((m, i) => {
      if (m.t !== 'act' || !moveUnlocked(m)) return;
      const can = P.mp >= m.mp && !(m.hpCost && P.hp <= P.hpMax * .15);
      let sub;
      if (m.heal) {
        sub = `回复${Math.round(m.heal * 100)}%气血${m.healMp ? '、' + Math.round(m.healMp * 100) + '%内力' : ''}`;
      } else {
        sub = `威力${r1(m.mult * (m.hits || 1))}倍${m.hits > 1 ? `（${m.hits}连击）` : ''}`;
        const fx = moveFxDesc(m);
        if (fx && fx !== '寻常招式') sub += ' · ' + fx;
      }
      btns.push(`<button class="btn" data-skl="${id}" data-mvi="${i}" ${can ? '' : 'disabled'}>${m.name}<small>${sk.name} · ${m.mp ? '内力' + m.mp : '无消耗'} · ${sub}</small></button>`);
    });
  });
  const potBtns = Object.entries(P.bag).filter(([id]) => {
    const it = ITEMS[id];
    return it && it.cat === 'pot' && !POTIONS[it.pot].perm;
  }).map(([id, n]) => `<button class="btn btn-sm" data-pot="${id}">${ITEMS[id].name} ×${n}</button>`).join('');
  const flee = B.noFlee ? '' : `<button class="btn" data-flee="1">逃 走</button>`;
  box.innerHTML = btns.join('') + potBtns + flee;
  box.querySelectorAll('[data-skl]').forEach(b => b.addEventListener('click', () => playerMove(b.dataset.skl, +b.dataset.mvi)));
  box.querySelectorAll('[data-pot]').forEach(b => b.addEventListener('click', () => playerPotion(b.dataset.pot)));
  const f = box.querySelector('[data-flee]');
  if (f) f.addEventListener('click', playerFlee);
}

// —— 玩家伤害计算（招式级） ——
function calcPlayerHit(m) {
  const e = B.e;
  if (!m.mustHit) {
    const dodge = clamp(4 + (e.spd - P.spd - (B.bf.spd ? P.lv : 0)) * .8, 2, 25);
    if (Math.random() * 100 < dodge) return { miss: true };
  }
  let atk = P.atk;
  if (passiveId() === 'rage' && P.hp < P.hpMax * .3) atk *= 1.25;
  if (B.atkBuffTurns > 0) atk *= 1.3;
  if (B.bf.atk > 0) atk *= 1.25;
  const hits = m.hits || 1;
  let total = 0, critAny = false;
  for (let i = 0; i < hits; i++) {
    let crit = false;
    if (m.mustCrit) crit = true;
    else if (B.firstCrit) { crit = true; B.firstCrit = false; }
    else if (B.bf.nextCrit) { crit = true; B.bf.nextCrit = false; }
    else crit = Math.random() * 100 < (P.crt + (m.critBonus || 0));
    const defv = m.ignoreDef ? 0 : e.def * .6;
    let d = (atk * m.mult - defv) * rf(.85, 1.15);
    if (crit) { d *= 1.8; critAny = true; }
    total += Math.max(1, Math.round(d));
  }
  return { dmg: total, crit: critAny };
}

function playerMove(key, idx) {
  if (!B || B.busy) return;
  const m = key === 'basic' ? { name: '普通攻击', t: 'act', mult: 1, mp: 0 } : SKILLS[key].moves[idx];
  if (!m) return;
  if (P.mp < m.mp) return;
  B.busy = true;
  Sfx.ensure();
  P.mp -= m.mp;
  if (m.hpCost) {
    const cost = Math.max(1, Math.round(P.hpMax * m.hpCost));
    P.hp = Math.max(1, P.hp - cost);
    blog(`你强催真气，燃烧自身气血 ${cost} 点！`, 'bad');
  }
  if (m.heal) {
    const h = Math.round(P.hpMax * m.heal), mm = Math.round(P.mpMax * (m.healMp || 0));
    P.hp = clamp(P.hp + h, 0, P.hpMax); P.mp = clamp(P.mp + mm, 0, P.mpMax);
    Sfx.heal();
    blog(`你运转「<b>${m.name}</b>」，真气流转周天——气血 +${h}，内力 +${mm}！`, 'good');
    floatDmg('player', '+' + h, 'heal');
    renderBattle();
    return setTimeout(companionTurn, 650);
  }
  blog(`你使出「<b>${m.name}</b>」！`);
  const r = calcPlayerHit(m);
  if (r.miss) {
    Sfx.miss();
    blog(`${B.e.name}身形一晃，堪堪避过！`, 'bad');
    floatDmg('enemy', '闪避', 'miss');
  } else {
    B.e.hp = Math.max(0, B.e.hp - r.dmg);
    if (r.crit) Sfx.crit(); else Sfx.hit();
    blog(`击中${B.e.name}，造成 <b>${r.dmg}</b> 点伤害${r.crit ? '（会心一击！）' : ''}${m.hits > 1 ? `（${m.hits}连击）` : ''}！`, r.crit ? 'good' : '');
    floatDmg('enemy', '-' + r.dmg, r.crit ? 'crit' : '');
    shakePanel('#battle-stage');
    // 吸血：武学被动（百分比）+ 招式自带（小数）
    const lsPct = (P.ls || 0) + (m.lifesteal || 0) * 100;
    if (lsPct > 0 && r.dmg > 0) {
      const h = Math.round(r.dmg * lsPct / 100);
      P.hp = clamp(P.hp + h, 0, P.hpMax);
      blog(`真气牵引，你吸取敌人体力，气血 +${h}。`, 'good');
      floatDmg('player', '+' + h, 'heal');
    }
    if (m.mpDrain && r.dmg > 0) {
      P.mp = clamp(P.mp + m.mpDrain, 0, P.mpMax);
      blog(`吞纳真气，你的内力 +${m.mpDrain}。`, 'good');
    }
    if (m.dot && B.e.hp > 0) {
      B.dot = { dmg: Math.max(2, Math.round(P.atk * m.dot)), turns: 3 };
      blog(`${B.e.name}中了阴毒，气血将源源流逝！`, 'good');
    }
    if (m.stun && B.e.hp > 0 && Math.random() < m.stun) {
      B.enemyStun = true;
      blog(`${B.e.name}被震得气血翻涌，动弹不得！`, 'good');
    }
  }
  if (m.defBuff) B.defBuffTurns = m.defBuff;
  if (m.atkBuff) B.atkBuffTurns = m.atkBuff;
  renderBattle();
  if (B.e.hp <= 0) return setTimeout(victory, 650);
  setTimeout(companionTurn, 800);
}

function playerPotion(itemId) {
  if (!B || B.busy) return;
  if (!P.bag[itemId]) return;
  B.busy = true;
  const it = ITEMS[itemId], pot = POTIONS[it.pot];
  removeItem(itemId);
  const boost = passiveId() === 'royal' ? 1.3 : 1;
  if (pot.hp) { const h = Math.round(pot.hp * boost); P.hp = clamp(P.hp + h, 0, P.hpMax); }
  if (pot.mp) { const m = Math.round(pot.mp * boost); P.mp = clamp(P.mp + m, 0, P.mpMax); }
  if (pot.pct) { P.hp = clamp(P.hp + Math.round(P.hpMax * pot.pct * boost), 0, P.hpMax); P.mp = clamp(P.mp + Math.round(P.mpMax * pot.pct), 0, P.mpMax); }
  if (pot.full) { P.hp = P.hpMax; P.mp = P.mpMax; }
  if (pot.bbAtk) B.bf.atk = pot.bbAtk;
  if (pot.bbDef) B.bf.def = pot.bbDef;
  if (pot.bbSpd) B.bf.spd = pot.bbSpd;
  if (pot.bbNextCrit) B.bf.nextCrit = true;
  if (pot.bbDodge) B.bf.dodge = true;
  if (pot.bbStun) B.enemyStun = true;
  Sfx.heal();
  blog(`你服下「${it.name}」，气血内力渐复！`, 'good');
  floatDmg('player', '恢复', 'heal');
  renderBattle();
  setTimeout(companionTurn, 650);
}

function playerFlee() {
  if (!B || B.busy) return;
  B.busy = true;
  const chance = clamp(40 + (P.spd - B.e.spd) * 2, 20, 90);
  if (Math.random() * 100 < chance) {
    blog('三十六计，走为上计！你几个起落，摆脱了追击。', 'sys');
    log('你从一场战斗中全身而退。');
    setTimeout(() => { B = null; show('#screen-home'); renderHome(); }, 800);
  } else {
    blog('你转身欲走，却被拦了回来！', 'bad');
    setTimeout(enemyTurn, 600);
  }
}

// —— 伙伴回合 ——
function compAttack(c, tag) {
  const e = B.e;
  let d = (c.atk * rf(.9, 1.1) - e.def * .4) * rf(.85, 1.1);
  d = Math.max(1, Math.round(d));
  e.hp = Math.max(0, e.hp - d);
  blog(`${c.name}使出「${tag}」，造成 <b>${d}</b> 点伤害！`, 'ally');
  floatDmg('enemy', '-' + d, 'ally');
}

function companionTurn() {
  if (!B) return;
  const alive = B.comps.filter(c => c.hp > 0);
  let i = 0;
  const next = () => {
    if (B.e.hp <= 0 || i >= alive.length) {
      renderBattle();
      if (B.e.hp <= 0) return setTimeout(victory, 600);
      return setTimeout(enemyTurn, 650);
    }
    const c = alive[i++];
    compAct(c);
    renderBattle();
    setTimeout(next, 420);
  };
  next();
}

function compAct(c) {
  const e = B.e;
  if (c.role === 'heal') {
    if (P.hp < P.hpMax * .6) {
      const h = Math.round(P.hpMax * .1 + P.lv * 8);
      P.hp = clamp(P.hp + h, 0, P.hpMax);
      blog(`${c.name}施展「${c.skill}」，为你回复气血 +${h}！`, 'ally');
      floatDmg('player', '+' + h, 'heal');
      return;
    }
    if (c.hp < c.hpMax * .4) {
      c.hp = clamp(c.hp + Math.round(c.hpMax * .3), 0, c.hpMax);
      blog(`${c.name}自行调息，回复了气血。`, 'ally');
      return;
    }
    return compAttack(c, c.skill);
  }
  if (c.role === 'tank') {
    if (Math.random() < .3) {
      B.cover = true;
      blog(`${c.name}横身挡在你身前（本回合你受伤 -40%）！`, 'ally');
      return;
    }
    return compAttack(c, c.skill);
  }
  if (c.role === 'sup') {
    const m = 5 + Math.round(P.lv * 1.2);
    P.mp = clamp(P.mp + m, 0, P.mpMax);
    blog(`${c.name}为你掠阵，内力 +${m}。`, 'ally');
    if (Math.random() < .15) {
      B.bf.nextCrit = true;
      blog(`${c.name}高喝一声：「看准了打！」你下一击必定会心！`, 'ally');
    }
    return compAttack(c, c.skill);
  }
  // atk
  if (Math.random() < .18) {
    let d = (c.atk * 1.3 * rf(.9, 1.1) - e.def * .4);
    d = Math.max(1, Math.round(d));
    e.hp = Math.max(0, e.hp - d);
    blog(`${c.name}欺身抢攻，追击造成 <b>${d}</b> 点伤害！`, 'ally');
    floatDmg('enemy', '-' + d, 'ally');
    return;
  }
  compAttack(c, c.skill);
}

// —— 敌人回合 ——
function enemyTurn() {
  if (!B) return;
  const e = B.e;
  // 被动恢复
  const regen = 3 + (P.mpregen || 0) + (passiveId() === 'regen' ? 4 : 0);
  P.mp = clamp(P.mp + regen, 0, P.mpMax);
  if (passiveId() === 'regenhp') P.hp = clamp(P.hp + Math.round(P.hpMax * .03), 0, P.hpMax);
  if (P.regen) P.hp = clamp(P.hp + Math.round(P.hpMax * P.regen / 100), 0, P.hpMax);
  if (B.enemyStun) {
    B.enemyStun = false;
    blog(`${e.name}气息紊乱，这一回合动弹不得！`, 'good');
    return endRound();
  }
  // 选目标
  const aliveComps = B.comps.filter(c => c.hp > 0);
  const targetComp = (aliveComps.length && Math.random() < .3) ? pick(aliveComps) : null;
  // 技能
  let mult = 1, sname = null, ls = 0;
  const usable = e.skills.filter(s => Math.random() < s.chance);
  if (usable.length) { const s = pick(usable); mult = s.mult; sname = s.name; ls = s.lifesteal || 0; }

  if (targetComp) {
    if (Math.random() < .15) {
      blog(`${c2s(targetComp)}身形一闪，避开了${e.name}的攻击！`, 'good');
    } else {
      let d = (e.atk * mult * .75 - P.lv * 1.4) * rf(.85, 1.15);
      d = Math.max(1, Math.round(d));
      targetComp.hp = Math.max(0, targetComp.hp - d);
      if (mult > 1.05) Sfx.crit(); else Sfx.hit();
      blog(`${e.name}${sname ? `使出「<b>${sname}」` : '出手'}击向${c2s(targetComp)}，造成 <b>${d}</b> 点伤害！`, 'bad');
      if (targetComp.hp <= 0) blog(`${c2s(targetComp)}伤重，退出战圈！`, 'bad');
    }
    renderBattle();
    return endRound();
  }

  // 攻击玩家
  let dodge = clamp(4 + (P.spd + (B.bf.spd ? P.lv : 0) - e.spd) * .8, 3, 30);
  if (passiveId() === 'dodge') dodge += 8;
  dodge += (P.dodgeBonus || 0);
  if (B.bf.dodge || Math.random() * 100 < dodge) {
    B.bf.dodge = false;
    Sfx.miss();
    blog(`你身形飘忽，${e.name}的${sname ? `「${sname}」` : '攻击'}落了空！`, 'good');
    floatDmg('player', '闪避', 'miss');
    return endRound();
  }
  let d = (e.atk * mult - P.def * .6) * rf(.85, 1.15);
  if (passiveId() === 'iron') d *= .9;
  d *= 1 - (P.dmgred || 0) / 100;
  if (B.defBuffTurns > 0) d *= .5;
  if (B.bf.def > 0) d *= .5;
  if (B.cover) d *= .6;
  const crit = Math.random() * 100 < e.crt;
  if (crit) d *= 1.7;
  d = Math.max(1, Math.round(d));
  P.hp = Math.max(0, P.hp - d);
  if (crit) Sfx.crit(); else Sfx.hit();
  const reduce = [];
  if (B.defBuffTurns > 0) reduce.push('护体减伤');
  if (B.bf.def > 0) reduce.push('药力护身');
  if (B.cover) reduce.push('同伴掩护');
  blog(`${e.name}${sname ? `使出「<b>${sname}」` : '出手'}，你受到 <b>${d}</b> 点伤害${crit ? '（重创！）' : ''}${reduce.length ? '（' + reduce.join('·') + '）' : ''}！`, 'bad');
  floatDmg('player', '-' + d, crit ? 'crit' : '');
  shakePanel('#screen-battle');
  if (ls && d > 0) {
    e.hp = clamp(e.hp + Math.round(d * ls), 0, e.hpMax);
    blog(`${e.name}移花接玉，回复了气血！`, 'bad');
  }
  renderBattle();
  if (P.hp <= 0) return setTimeout(defeat, 650);
  endRound();
}
const c2s = c => `<b>${c.name}</b>`;

function endRound() {
  if (!B) return;
  B.cover = false;
  if (B.dot) {
    B.e.hp = Math.max(0, B.e.hp - B.dot.dmg);
    blog(`阴毒发作，${B.e.name}损失 ${B.dot.dmg} 点气血！`, 'good');
    if (--B.dot.turns <= 0) B.dot = null;
  }
  if (B.defBuffTurns > 0) B.defBuffTurns--;
  if (B.atkBuffTurns > 0) B.atkBuffTurns--;
  ['atk', 'def', 'spd'].forEach(k => { if (B.bf[k] > 0) B.bf[k]--; });
  B.round++;
  B.busy = false;
  renderBattle();
  if (B.e.hp <= 0) return setTimeout(victory, 600);
  renderBattleActions();
}

// —— 掉落 ——
function rollDrop() {
  const map = MAPS.find(m => m.id === curMap) || MAPS[0];
  const lv = map.lv;
  const roll = Math.random();
  if (roll < .32) {
    const tier = clamp(Math.ceil(lv / 10), 1, 5);
    const kind = pick(['ore', 'hide', 'herb', 'misc']);
    const cands = [];
    MATS[kind].forEach((n, i) => { if (MAT_TIER[i] === tier) cands.push('mat_' + kind + '_' + i); });
    return pick(cands);
  }
  if (roll < .55) {
    let key;
    if (lv < 10) key = pick(['jinchuang', 'neixi', 'jinchuang']);
    else if (lv < 20) key = pick(['yulu', 'liaoshang', 'ningqi']);
    else if (lv < 30) key = pick(['huichun', 'ningqi', 'guiyuan']);
    else if (lv < 40) key = pick(['xuming', 'dahuan', 'guiyuan']);
    else key = pick(['xuming', 'dahuan', 'jiuzhuan']);
    return 'pot_' + key;
  }
  if (roll < .72) return 'tr_' + rnd(0, TREASURES.length - 1);
  if (roll < .88) {
    const slot = rnd(0, 2);
    if (slot === 0) {
      const tr = WTIER_LV.reduce((acc, need, i) => lv >= need ? i : acc, 0);
      return 'w_' + rnd(0, WTYPES.length - 1) + '_' + tr;
    }
    if (slot === 1) {
      const tr = [1, 10, 20, 28, 36].reduce((acc, need, i) => lv >= need ? i : acc, 0);
      return 'a_' + rnd(0, ATYPES.length - 1) + '_' + tr;
    }
    const tr = [5, 18, 32].reduce((acc, need, i) => lv >= need ? i : acc, 0);
    return 'acc_' + rnd(0, ACC_TYPES.length - 1) + '_' + tr;
  }
  return 'book_univ' + rnd(0, UNIVERSAL_SKILLS.length - 1);
}

// —— 胜利结算 ——
function victory() {
  if (!B) return;
  const e = B.e;
  const ctx = { bossId: B.bossId, bountyKey: B.bountyKey, tournament: B.tournament };
  P.kills++;
  let exp = e.exp, silver = e.silver + rnd(0, Math.round(e.silver * .3));
  let drops = [];
  if (Math.random() < .35) {
    const d = rollDrop();
    addItem(d, 1);
    drops.push(ITEMS[d].name);
  }
  if (passiveId() === 'onkill') {
    const h = Math.round(P.hpMax * .2);
    P.hp = clamp(P.hp + h, 0, P.hpMax);
    blog(`明玉真气运转，击敌回气 +${h}！`, 'good');
  }
  B = null;

  let extra = '';
  let isChapterBoss = false;
  // 头目奖励
  if (ctx.bossId) {
    const boss = BOSSES[ctx.bossId], rw = boss.reward || {};
    flags.bossBeaten[ctx.bossId] = true;
    P.bossKills++;
    const rewards = [];
    if (rw.silver) { P.silver += rw.silver; rewards.push(`银两 ${rw.silver}`); }
    if (rw.item) { addItem(rw.item); rewards.push(`「${ITEMS[rw.item].name}」`); }
    if (rw.skill && !P.skills.includes(rw.skill)) {
      const slot = grantSkill(rw.skill);
      rewards.push(`绝学「${SKILLS[rw.skill].name}」${slot ? '（运功·' + slot + '）' : ''}`);
    }
    if (rw.potions) Object.entries(rw.potions).forEach(([k, n]) => { addItem('pot_' + k, n); rewards.push(`${POTIONS[k].name} ×${n}`); });
    if (rw.sp) { addItem('sp_' + rw.sp); rewards.push(`「${SPECIALS[rw.sp].name}」`); }
    if (rewards.length) extra += `<div class="divider"></div><p><b>缴获：</b>${rewards.join('、')}</p>`;
    const chapter = CHAPTERS[flags.ch - 1];
    if (chapter && chapter.boss === ctx.bossId) {
      isChapterBoss = true;
      const doneCh = flags.ch;
      flags.ch = Math.min(11, flags.ch + 1);
      // 剧情伙伴入队
      Object.entries(COMPANIONS).forEach(([id, c]) => {
        if (c.recruit === 'story' + doneCh && !P.comps.includes(id)) {
          P.comps.push(id);
          if (P.compActive.length < 2) P.compActive.push(id);
          extra += `<p style="margin-top:8px"><b style="color:var(--jade)">「${c.name}」加入了你的队伍！</b></p>`;
        }
      });
      if (STORY_AFTER[ctx.bossId]) {
        extra += `<div class="divider"></div><p style="white-space:pre-line">${STORY_AFTER[ctx.bossId]}</p>`;
      }
    }
  }
  // 悬赏结算
  if (ctx.bountyKey) {
    const b = flags.bounty.list.find(x => x.key === ctx.bountyKey);
    if (b && !flags.bounty.done[b.key]) {
      flags.bounty.done[b.key] = true;
      flags.bountyCount++;
      const bs = Math.round(b.silver * (hasPerk('bounty') ? 1.25 : 1));
      P.silver += bs; exp += b.exp;
      extra += `<div class="divider"></div><p><b>悬赏达成！</b>额外获得银两 <b class="gold">${bs}</b>、经验 ${b.exp}。</p>`;
    }
  }
  P.silver += silver;
  Sfx.victory();
  blog(`「${e.name}」倒下了！获得经验 <b>${exp}</b>，银两 <b>${silver}</b>。`, 'good');
  log(`你击败了${ctx.bossId ? '头目' : ''}「${e.name}」，得银两 ${silver}。`, 'good');
  if (drops.length) log(`战利品：${drops.join('、')}。`, 'good');

  show('#screen-home');
  renderStatus();
  save();
  gainExp(exp);
  checkTitles();
  save();

  if (ctx.tournament) {
    const finalWin = TOUR.step >= 3;
    modal('比武 · 胜',
      `<p>第 ${TOUR.step} / 3 场获胜！${finalWin ? '三战三捷，全场哗然！' : '稍作喘息，下一场对手已在台上等候。'}</p>
       <p class="muted">经验 +${exp}，银两 +${silver}。</p>`,
      [{ label: finalWin ? '登台加冕' : '再战', primary: true, fn: () => finalWin ? tourChampion() : tourNext() }]);
    return;
  }
  const ending = isChapterBoss && ctx.bossId === 'dongfangyao';
  if (ending && !flags.ended) {
    flags.ended = true;
    save();
    modal('大结局 · 日出东方',
      `<div class="ending-body">${STORY_AFTER.dongfangyao.replace(/\n/g, '<br>')}</div>`,
      [{ label: '天下第一', primary: true, fn: () => renderHome() }]);
  } else {
    modal(ctx.bossId ? '头目授首' : '战斗胜利',
      `<p>「<b>${e.name}</b>」俯首认输，轰然倒地。</p>
       <p>获得经验 <b>${exp}</b>，银两 <b class="gold">${silver}</b>。</p>
       ${drops.length ? `<p class="muted">拾得：${drops.join('、')}</p>` : ''}${extra}`,
      [{ label: '再闯江湖', primary: true, fn: () => renderHome() }]);
  }
}

function defeat() {
  const wasTour = B && B.tournament;
  B = null;
  Sfx.defeat();
  if (wasTour) {
    TOUR.active = false;
    log('比武大会上憾负一场，止步于此。', 'bad');
    save();
    show('#screen-home');
    modal('憾负台下',
      `<p>你被对手一记巧招撂下台去——虽败犹荣，满堂喝彩。</p>
       <p class="muted">比武大会不受银两损失。来日方长，练好功夫再来！</p>`,
      [{ label: '卷土重来', primary: true, fn: () => renderHome() }]);
    return;
  }
  const lost = Math.round(P.silver * .2);
  P.silver -= lost;
  P.hp = Math.max(1, Math.round(P.hpMax * .3));
  log('你身受重伤，被路过的好心镖师所救……', 'bad');
  save();
  show('#screen-home');
  modal('败走麦城',
    `<p>眼前一黑，你倒在了血泊之中……</p>
     <p>醒来时，你已躺在客栈的床上——是路过的镖师把你救了回来。医馆耗费不菲，扣除银两 <b class="gold">${lost}</b>。</p>
     <p class="muted">胜败乃兵家常事。回客栈歇息，打坐修炼，卷土重来！</p>`,
    [{ label: '重整旗鼓', primary: true, fn: () => { renderHome(); } }]);
}
/* ============ 玩法系统：悬赏榜 · 锻造 · 比武大会 · 称号 ============ */

// —— 悬赏榜 ——
function ensureBounty() {
  if (!flags.bounty) flags.bounty = { round: 1, list: null, done: {} };
  if (!flags.bounty.list) genBounties();
}
function genBounties() {
  if (!flags.bounty) flags.bounty = { round: 1, list: null, done: {} };
  const list = [];
  const nearMaps = MAPS.filter(m => Math.abs(m.lv - P.lv) <= 6);
  for (let i = 0; i < 4; i++) {
    const m = nearMaps.length ? pick(nearMaps) : pick(MAPS);
    const lv = clamp(P.lv + rnd(-2, 3), 1, 52);
    const name = pick(ENEMY_POOLS[m.region]);
    list.push({
      key: flags.bounty.round + '_' + i,
      name, lv, mapName: m.name,
      silver: 60 + lv * 42, exp: 30 + lv * 14
    });
  }
  flags.bounty.list = list;
}
function openBounty() {
  ensureBounty();
  const rows = flags.bounty.list.map(b => {
    const done = flags.bounty.done[b.key];
    return `<div class="list-row bounty-row">
      <div class="grow"><b>${b.name}</b>（${b.lv}级）<small>现身于${b.mapName} · 赏金 ${b.silver} 两 · 经验 ${b.exp}${done ? ' · 已完成' : ''}</small></div>
      ${done ? '<span class="tag">已了结</span>' : `<button class="btn btn-sm btn-primary" data-bt="${b.key}">缉拿</button>`}
    </div>`;
  }).join('');
  modal('悬赏榜 · 六扇门',
    `<p class="muted" style="margin-bottom:6px">官府张榜，缉拿江湖恶徒。了结一单，赏银结清。<b>百晓生随行时赏金 +25%</b>。你已了结 <b>${flags.bountyCount || 0}</b> 单。</p>${rows}
     <div class="divider"></div>
     <p class="muted">榜单自有更新之时——花 80 两银子，托捕快换一批新榜。</p>`,
    [{ label: '关闭', fn: null }, { label: '换一批（80两）', primary: true, fn: refreshBounty }]);
  $('#modal-root').querySelectorAll('[data-bt]').forEach(b => b.addEventListener('click', () => {
    const key = b.dataset.bt;
    const target = flags.bounty.list.find(x => x.key === key);
    if (!target) return;
    closeModal();
    const e = GEN.mkEnemy(target.name, target.lv, {
      hpMul: 1.6, atkMul: 1.05, silMul: 0, expMul: 1,
      flavor: '"官府画影图形捉拿的，就是老子？"'
    });
    curMap = (MAPS.find(m => m.name === target.mapName) || MAPS.find(m => m.id === curMap) || MAPS[0]).id;
    startBattle(e, { bountyKey: key });
  }));
}
function refreshBounty() {
  if (P.silver < 80) return toast('银两不足。');
  P.silver -= 80;
  flags.bounty.round++;
  genBounties();
  Sfx.coin();
  save();
  openBounty();
}

// —— 锻造 ——
function forgeInfo(slot) {
  const id = P[slot];
  if (!id) return null;
  const it = ITEMS[id];
  const star = forgeStar(id);
  const matTier = clamp(it.tier, 1, 5);
  const matNeed = star + 1;
  const cost = Math.round((120 + it.tier * 90) * (star + 1) * (hasPerk('forgeCost') ? .75 : 1));
  const rate = clamp(.92 - star * .07, .25, .95) + (hasPerk('forgeRate') ? .1 : 0);
  return { id, it, star, matTier, matNeed, cost, rate };
}
function starStr(n) { return '★'.repeat(n) + '☆'.repeat(10 - n); }
function openForge() {
  const slots = ['weapon', 'armor', 'acc'].map(slot => {
    const f = forgeInfo(slot);
    if (!f) return `<div class="list-row"><div class="grow"><b>${{ weapon: '兵刃', armor: '护甲', acc: '饰品' }[slot]}</b><small>尚未装备</small></div></div>`;
    const mats = countMat(f.matTier);
    const needSoul = f.it.tier === 6;
    const soulOk = !needSoul || (P.bag['sp_jianhun'] || 0) >= 1;
    const can = f.star < 10 && mats >= f.matNeed && P.silver >= f.cost && soulOk;
    const statTxt = f.it.slot === 'weapon'
      ? `攻击 +${f.it.atk + forgeAdd(f.it.atk, f.id)}`
      : f.it.slot === 'armor' ? `防御 +${f.it.def + forgeAdd(f.it.def, f.id)}` : f.it.desc.replace(/^.*——/, '');
    return `<div class="list-row">
      <div class="grow"><b>${f.it.name}</b><span class="forge-star">${starStr(f.star)}</span>
        <small>${statTxt} · ${f.it.tier}阶装备 · 需 ${f.matTier}阶材料 ×${f.matNeed}（有 ${mats}）${needSoul ? ' · 剑魂 ×1' : ''} · 银两 ${f.cost} · 成功率 ${fmtPct(f.rate)}</small></div>
      ${f.star >= 10 ? '<span class="tag">+10 极限</span>' : `<button class="btn btn-sm btn-gold" data-fg="${slot}" ${can ? '' : 'disabled'}>锻造</button>`}
    </div>`;
  }).join('');
  modal('锻造 · 铸剑山庄',
    `<p class="muted" style="margin-bottom:6px">千锤百炼，方成神兵。强化 +1 至 +10，每星提升基础属性 8%（至少 +1）。<b>失败会掉一星</b>，还请三思。
     ${hasComp('oyeeqing') && P.compActive.includes('oyeeqing') ? '欧冶青随行：费用 -25%。' : ''}${hasComp('ganxiaomei') && P.compActive.includes('ganxiaomei') ? '干小妹随行：成功率 +10%。' : ''}</p>
     <div class="divider"></div>${slots}
     <div class="divider"></div>
     <p class="muted">材料来自探索与战斗缴获；神兵（六阶）另需「剑魂」。当前持有剑魂 ×${P.bag['sp_jianhun'] || 0}。</p>`,
    [{ label: '关闭', fn: null }, { label: '收锤歇业', primary: true }]);
  $('#modal-root').querySelectorAll('[data-fg]').forEach(b => b.addEventListener('click', () => {
    doForge(b.dataset.fg);
  }));
}
function doForge(slot) {
  const f = forgeInfo(slot);
  if (!f) return;
  if (f.star >= 10) return toast('已达锻造极限。');
  if (countMat(f.matTier) < f.matNeed) return toast('材料不足。');
  if (P.silver < f.cost) return toast('银两不足。');
  if (f.it.tier === 6 && !(P.bag['sp_jianhun'] >= 1)) return toast('神兵锻造需要「剑魂」。');
  consumeMat(f.matTier, f.matNeed);
  if (f.it.tier === 6) removeItem('sp_jianhun', 1);
  P.silver -= f.cost;
  closeModal();
  if (Math.random() < f.rate) {
    P.forge[f.id] = f.star + 1;
    P.forgeSucc++;
    recompute();
    Sfx.forge();
    log(`锻造成功！「${f.it.name}」升至 +${f.star + 1}。`, 'good');
    modal('百炼成钢',
      `<p>炉火纯青，一声清鸣——「<b>${f.it.name}</b>」锻造成功，升至 <b class="gold">+${f.star + 1}</b>！</p>
       <p class="muted">${starStr(f.star + 1)}</p>`,
      [{ label: '再锻', fn: () => openForge() }, { label: '好剑！', primary: true, fn: () => { renderStatus(); save(); } }]);
    checkTitles();
    save();
  } else {
    if (f.star > 0) P.forge[f.id] = f.star - 1;
    recompute();
    Sfx.fail();
    log(`锻造失败，「${f.it.name}」${f.star > 0 ? '降为 +' + (f.star - 1) : '纹丝不动'}。`, 'bad');
    modal('功亏一篑',
      `<p>火候差了一分，铁胚发出一声闷响——锻造失败${f.star > 0 ? '，「' + f.it.name + '」降为 +' + (f.star - 1) : '，「' + f.it.name + '」幸而无损'}。</p>
       <p class="muted">锻造之道，七分天意，三分人力。</p>`,
      [{ label: '再试', fn: () => openForge() }, { label: '罢了', primary: true, fn: () => { renderStatus(); save(); } }]);
    save();
  }
}

const TOUR = { active: false, step: 0, names: [] };
const TOUR_NAMES = ['铁剑先生', '追风快刀', '判官笔客', '千手书生', '断岳枪王', '踏云女侠', '醉里挑灯客', '百步穿杨手', '寒潭剑影', '燕山怪杰'];

function openTournament() {
  if (P.lv < 10) {
    return modal('比武大会', `<p>台下老者摇了摇头："后生，功夫不到家，上台是挨打。等级 10 再来吧。"</p>`);
  }
  const lvReq = flags.tourLvReq || 10;
  if (P.lv < lvReq) {
    return modal('比武大会',
      `<p>你上次夺魁的余温尚在，擂主不肯再与你交手。</p><p class="muted">冠军需等级 ${lvReq} 后方可再战（磨刀不误砍柴工）。</p>`);
  }
  modal('泰山比武大会',
    `<p>五湖四海的英雄齐聚泰山，擂台三丈，胜负立判。</p>
     <p><b>规则：</b>连胜三场即为魁首。头目级对手，实力随你的声名水涨船高。</p>
     <p>参赛费 <b class="gold">100 两</b>。魁首赏银 <b class="gold">${400 + P.lv * 60} 两</b>，另有名动天下之荣。</p>
     <p class="muted">你已夺冠 ${P.tourWins} 次。</p>`,
    [{ label: '再等等', fn: null }, {
      label: '登台！', primary: true, fn: () => {

        startTournament();
      }

}
function startTournament() {
  TOUR.active = true;
  TOUR.step = 0;
  TOUR.names = shuffle(TOUR_NAMES).slice(0, 3);
  log('你跃上擂台，与群雄一较高下！', 'sys');
  save();
  tourNext();
}
function tourNext() {
  if (!TOUR.active) return;
  if (TOUR.step >= 3) return tourChampion();
  TOUR.step++;
  const lv = P.lv + TOUR.step - 1;
  const name = TOUR.names[TOUR.step - 1];
  const e = GEN.mkEnemy(name, lv, {
    hpMul: 2.1, atkMul: 1.02, expMul: 2, silMul: 4,
    skills: [{ name: '大会名招', mult: 1.7, chance: .32 }],
    flavor: '"承让了！"'
  });
  startBattle(e, { tournament: true });
}
function tourChampion() {
  TOUR.active = false;
  const silver = 400 + P.lv * 60;
  P.silver += silver;
  P.tourWins++;
  flags.tourLvReq = P.lv + 3;
  let extra = '';
  if (!P.comps.includes('shiajiu')) {
    P.comps.push('shiajiu');
    if (P.compActive.length < 2) P.compActive.push('shiajiu');
    extra += `<p style="margin-top:8px"><b style="color:var(--jade)">守剑冢的少年石阿九看得目眩神驰，当场拜你为师，随你行走江湖！</b></p>`;
  }
  Sfx.victory();
  log(`你在比武大会上连胜三场，夺魁！赏银 ${silver}。`, 'good');
  checkTitles();
  save();
  modal('魁首 · 天下扬名',
    `<p>三场连胜，台下喝彩如雷！你捧起鎏金擂主印，名动江湖。</p>
     <p>获得赏银 <b class="gold">${silver} 两</b>。</p>${extra}
     <p class="muted">擂主放话：待你等级 ${flags.tourLvReq}，再来做过一场。</p>`,
    [{ label: '功成身退', primary: true, fn: () => { renderStatus(); renderHome(); } }]);
}

// ---------- 屏幕切换 ----------
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ---------- 弹窗（队列，避免覆盖）----------
const mQueue = [];
function modal(title, bodyHtml, buttons) {
  if ($('#modal-root').classList.contains('show')) {
    mQueue.push([title, bodyHtml, buttons]);
    return;
  }
  const root = $('#modal-root');
  buttons = buttons || [{ label: '确 定', primary: true, fn: null }];
  const btns = buttons.map((b, i) =>
    `<button class="btn ${b.primary ? 'btn-primary' : ''}" data-mbtn="${i}">${b.label}</button>`).join('');
  root.innerHTML = `<div class="overlay"></div>
    <div class="modal panel"><h2>${title}</h2><hr class="hr"><div class="body">${bodyHtml}</div>
    <div class="foot">${btns}</div></div>`;
  root.classList.add('show');
  root.querySelectorAll('[data-mbtn]').forEach(el => {
    el.addEventListener('click', () => {
      const b = buttons[+el.dataset.mbtn];
      Sfx.ensure(); Sfx.click();
      closeModal();
      if (b && b.fn) b.fn();
    });
  });
}
function closeModal() {
  $('#modal-root').classList.remove('show');
  $('#modal-root').innerHTML = '<div class="overlay"></div>';
  if (mQueue.length) {
    const [t, b, btns] = mQueue.shift();
    modal(t, b, btns);
  }
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1600);
  setTimeout(() => t.remove(), 2000);
}

function compStatus(c) {

  if (c.recruit === 'story') return `<span class="tag">主线剧情入队</span>`;
  if (c.recruit === 'tournament') return `<span class="tag">比武夺冠入队</span>`;
  const here = curMap === c.map;
  if (c.recruit === 'hire') {
    return here && P.silver >= c.cost
      ? `<button class="btn btn-sm btn-gold" data-hire="${idOf(c)}">雇请（${c.cost}两）</button>`
      : `<span class="tag">${here ? '银两不足' : '需至' + mapName(c.map)}</span>`;
  }

}
const idOf = c => Object.keys(COMPANIONS).find(k => COMPANIONS[k] === c);
const mapName = id => (MAPS.find(m => m.id === id) || { name: '?' }).name;

function openCompanions() {
  const activeHtml = P.compActive.map(id => {

  const rosterHtml = Object.values(COMPANIONS).map(c => {
    const id = idOf(c);

     <div class="divider"></div><p><b>随行阵容</b></p>${activeHtml}

// ---------- 商店 ----------
function ensureShop() {
  if (!flags.shop) flags.shop = { round: 0, stock: [] };
  if (!flags.shop.stock.length) genShop();
}
function gearByLv(lv) {
  const wTr = WTIER_LV.reduce((acc, need, i) => lv >= need ? i : acc, 0);
  const aTr = [1, 10, 20, 28, 36].reduce((acc, need, i) => lv >= need ? i : acc, 0);
  const cTr = [5, 18, 32].reduce((acc, need, i) => lv >= need ? i : acc, 0);
  return [
    'w_' + rnd(0, WTYPES.length - 1) + '_' + wTr,
    'w_' + rnd(0, WTYPES.length - 1) + '_' + wTr,
    'a_' + rnd(0, ATYPES.length - 1) + '_' + aTr,
    'a_' + rnd(0, ATYPES.length - 1) + '_' + aTr,
    'acc_' + rnd(0, ACC_TYPES.length - 1) + '_' + cTr
  ];
}
function genShop() {
  if (!flags.shop) flags.shop = { round: 0, stock: [] };
  flags.shop.round++;
  const gear = gearByLv(P.lv + 2);
  const pots = shuffle(['pot_jinchuang', 'pot_liaoshang', 'pot_neixi', 'pot_dahuan', 'pot_huichun', 'pot_ningqi', 'pot_xiaohuan', 'pot_guiyuan'])
    .slice(0, 3);
  flags.shop.stock = gear.concat(pots);
}
function openShop() {
  ensureShop();
  const stockRows = flags.shop.stock.map(id => {
    const it = ITEMS[id];
    if (!it) return '';
    const sold = it.cat === 'pot' ? false : flags.shop.sold && flags.shop.sold[flags.shop.round + id];
    return `<div class="list-row">
      <div class="grow"><b>${it.name}</b><small>${it.desc}</small></div>
      <span class="gold">${it.price} 两</span>
      ${sold ? '<span class="tag">已售</span>' : `<button class="btn btn-sm" data-buy="${id}">购买</button>`}
    </div>`;
  }).join('');
  const potRows = ['jinchuang', 'yulu', 'liaoshang', 'neixi', 'ningqi', 'xiaohuan'].map(k => {
    const it = ITEMS['pot_' + k];
    return `<div class="list-row">
      <div class="grow"><b>${it.name}</b> <small>${it.desc}（持有 ${P.bag['pot_' + k] || 0}）</small></div>
      <span class="gold">${it.price} 两</span>
      <button class="btn btn-sm" data-buy="pot_${k}">购买</button>
    </div>`;
  }).join('');
  modal('飞鸽购药 · 万宝商行',
    `<p class="muted" style="margin-bottom:6px">信鸽振翅，隔日即达。你现有 <b class="gold">${P.silver} 两</b>。</p>
     <div class="divider"></div><p><b>本期到货（第 ${flags.shop.round} 期）</b></p>${stockRows}
     <p class="muted" style="margin-top:4px">花 30 两请商行换一批货。</p>
     <div class="divider"></div><p><b>丹药常备</b></p>${potRows}`,
    [{ label: '关闭', fn: null }, { label: '换货（30两）', primary: true, fn: refreshShop }]);
  $('#modal-root').querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.buy, it = ITEMS[id];
    if (P.silver < it.price) return toast('银两不足！');

function refreshShop() {
  if (P.silver < 30) return toast('银两不足。');

  save();
  openShop();

// ---------- 行囊 ----------
function equipSlotName(slot) { return { weapon: '兵刃', armor: '护甲', acc: '饰品' }[slot]; }
function openBag() {
  const cats = { equip: [], pot: [], mat: [], trs: [], book: [], sp: [] };
  Object.entries(P.bag).forEach(([id, n]) => {
    const it = ITEMS[id];
    if (it) cats[it.cat].push([id, n]);
  });
  const equipHtml = cats.equip.map(([id, n]) => {
    const it = ITEMS[id];
    const worn = P.weapon === id || P.armor === id || P.acc === id;
    const star = forgeStar(id);
    return `<div class="list-row ${worn ? 'equipped' : ''}">
      <div class="grow"><b>${it.name}</b>${n > 1 ? ' ×' + n : ''}${star ? ` <span class="forge-star">+${star}</span>` : ''}
        <small>${it.desc} · ${equipSlotName(it.slot)}</small></div>
      ${worn ? '<span class="tag">装备中</span>' : `<button class="btn btn-sm btn-primary" data-eq="${id}">装备</button>`}
      <button class="btn btn-sm" data-sell="${id}">售${Math.round(it.price / 2)}两</button>
    </div>`;
  }).join('') || '<p class="muted">尚无兵刃护甲。</p>';

  const potHtml = cats.pot.map(([id, n]) => {
    const it = ITEMS[id];
    return `<div class="list-row">
      <div class="grow"><b>${it.name}</b> ×${n}<small>${it.desc}</small></div>
      <button class="btn btn-sm btn-primary" data-use="${id}">服用</button>
    </div>`;
  }).join('') || '<p class="muted">无丹药。</p>';

  const matHtml = cats.mat.map(([id, n]) => {
    const it = ITEMS[id];
    return `<div class="list-row"><div class="grow"><b>${it.name}</b> ×${n}<small>${it.desc}</small></div></div>`;
  }).join('') || '<p class="muted">无材料。</p>';

  const trsHtml = cats.trs.concat(cats.sp).map(([id, n]) => {
    const it = ITEMS[id];
    return `<div class="list-row">
      <div class="grow"><b>${it.name}</b>${n > 1 ? ' ×' + n : ''}<small>${it.desc}</small></div>
      <button class="btn btn-sm btn-gold" data-sell="${id}">售${it.sell}两</button>
    </div>`;
  }).join('') || '<p class="muted">无珍玩。</p>';

  const bookHtml = cats.book.map(([id, n]) => {
    const it = ITEMS[id];
    const known = P.skills.includes(it.bookSkill);
    return `<div class="list-row">
      <div class="grow"><b>${it.name}</b>${n > 1 ? ' ×' + n : ''}<small>${it.desc}</small></div>
      ${known ? '<span class="tag">已参悟</span>' : `<button class="btn btn-sm btn-primary" data-read="${id}">研读</button>`}
    </div>`;
  }).join('') || '<p class="muted">无秘籍。</p>';

  modal('行囊 · 盘缠',
    `<p><b>兵刃：</b>${P.weapon ? ITEMS[P.weapon].name + (forgeStar(P.weapon) ? ' +' + forgeStar(P.weapon) : '') : '赤手空拳'}
    　<b>护甲：</b>${P.armor ? ITEMS[P.armor].name + (forgeStar(P.armor) ? ' +' + forgeStar(P.armor) : '') : '粗衣布衫'}
    　<b>饰品：</b>${P.acc ? ITEMS[P.acc].name + (forgeStar(P.acc) ? ' +' + forgeStar(P.acc) : '') : '无'}
    　<b>银两：</b><span class="gold">${P.silver}</span></p>
     <div class="divider"></div><p><b>装备</b></p>${equipHtml}
     <div class="divider"></div><p><b>丹药</b></p>${potHtml}
     <div class="divider"></div><p><b>秘籍</b></p>${bookHtml}
     <div class="divider"></div><p><b>材料（锻造用）</b></p>${matHtml}
     <div class="divider"></div><p><b>珍玩（可售）</b></p>${trsHtml}`,
    [{ label: '关闭', fn: null }, { label: '收拾妥当', primary: true }]);

  $('#modal-root').querySelectorAll('[data-eq]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.eq, it = ITEMS[id];
    if (it.slot === 'weapon') P.weapon = id;
    else if (it.slot === 'armor') P.armor = id;
    else P.acc = id;
    recompute(); save();
    toast(`已装备「${it.name}」。`);
    closeModal(); renderStatus(); openBag();
  }));
  $('#modal-root').querySelectorAll('[data-use]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.use, pot = POTIONS[ITEMS[id].pot];
    if (pot.bbAtk || pot.bbDef || pot.bbSpd || pot.bbNextCrit || pot.bbDodge || pot.bbStun)
      return toast('此物须在战斗中服用。');
    removeItem(id);
    const boost = passiveId() === 'royal' ? 1.3 : 1;
    if (pot.hp) P.hp = clamp(P.hp + Math.round(pot.hp * boost), 0, P.hpMax);
    if (pot.mp) P.mp = clamp(P.mp + Math.round(pot.mp * boost), 0, P.mpMax);
    if (pot.pct) { P.hp = clamp(P.hp + Math.round(P.hpMax * pot.pct * boost), 0, P.hpMax); P.mp = clamp(P.mp + Math.round(P.mpMax * pot.pct), 0, P.mpMax); }
    if (pot.full) { P.hp = P.hpMax; P.mp = P.mpMax; }
    if (pot.perm) {
      Object.entries(pot.perm).forEach(([k, v]) => { P.bonus[k] = (P.bonus[k] || 0) + v; });
      recompute();
      toast('药力化入经脉，属性永久提升！');
    }
    Sfx.heal(); save();
    closeModal(); renderStatus(); openBag();
  }));
  $('#modal-root').querySelectorAll('[data-sell]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.sell, it = ITEMS[id];
    const val = Math.round(it.price / 2);
    removeItem(id);
    P.silver += val;
    Sfx.coin();
    toast(`售出「${it.name}」，得 ${val} 两。`);
    save(); closeModal(); renderStatus(); openBag();
  }));
  $('#modal-root').querySelectorAll('[data-read]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.read, it = ITEMS[id];
    removeItem(id);
    const slot = grantSkill(it.bookSkill);
    recompute();
    Sfx.levelup();
    log(`你参悟了「${SKILLS[it.bookSkill].name}」！`, 'good');
    save();
    closeModal();
    modal('武学精进', `<p>你挑灯夜读，豁然贯通——习得「<b>${SKILLS[it.bookSkill].name}</b>」！</p>
      <p class="muted">${SKILLS[it.bookSkill].desc}</p>
      ${slot ? `<p>真气自行流转，此功已运于<b style="color:var(--jade)">${slot}</b>之位。</p>` : ''}`,
      [{ label: '好哉', primary: true, fn: () => openBag() }]);
  }));
}

// ---------- 武学 ----------
function moveRow(m) {
  const un = moveUnlocked(m);
  const tag = m.t === 'act' ? '<span class="mtag act">主动</span>' : '<span class="mtag pas">被动</span>';
  let d;
  if (m.t === 'pas') d = moveFxDesc(m);
  else if (m.heal) d = `回复${Math.round(m.heal * 100)}%气血${m.healMp ? `、${Math.round(m.healMp * 100)}%内力` : ''}`;
  else {
    d = `威力 ${r1(m.mult * (m.hits || 1))} 倍${m.hits > 1 ? `（${m.hits}连击）` : ''}`;
    const fx = moveFxDesc(m);
    if (fx && fx !== '寻常招式') d += ' · ' + fx;
  }
  return `<div class="move-row${un ? '' : ' locked'}"><span class="mno">${MV_NAME[m.mv - 1]}</span>${tag}<b>${esc(m.name)}</b><span class="mfx">${d}${un ? '' : `　<span class="red">${m.unlock}级参悟</span>`}</span></div>`;
}

function openSkills() {
  const s = SECTS[P.sect];
  const sectSkillIds = s.skills.map((d, i) => P.sect + '_s' + i);
  const equipped = equippedSkillIds();

  const slotRow = (label, id) => {
    if (!id) return `<div class="list-row"><div class="grow"><b class="muted">${label} · 空</b><small>习得${label === '主套路' || label === '副套路' ? '套路' : label}武学后自动运功于此</small></div></div>`;
    const sk = SKILLS[id];
    return `<div class="list-row equipped">
      <div class="grow"><b>${esc(sk.name)}</b> <span class="tag">${label} · ${CAT_NAME[sk.cat]}</span>
        <small>${sk.desc}</small>
        <div style="margin-top:5px">${sk.moves.map(moveRow).join('')}</div></div>
    </div>`;
  };

  const catRows = cat => P.skills.filter(k => k !== 'basic' && SKILLS[k].cat === cat).map(k => {
    const sk = SKILLS[k];
    const worn = equipped.includes(k);
    const canWear = P.lv >= sk.lv;
    return `<div class="list-row">
      <div class="grow"><b>${esc(sk.name)}</b> <span class="tag">${CAT_NAME[cat]}</span>
        <small>${sk.desc} · ${sk.lv}级武学${canWear ? '' : '（' + sk.lv + '级方可参悟）'}</small></div>
      ${worn ? '<span class="tag jade">运功中</span>' : (canWear ? `<button class="btn btn-sm btn-primary" data-wear="${k}">运功</button>` : '<span class="tag">未参悟</span>')}
    </div>`;
  }).join('');

  const future = sectSkillIds.filter(k => !P.skills.includes(k)).map(k =>
    `<div class="list-row"><div class="grow"><b>${esc(SKILLS[k].name)}</b> <span class="tag">${CAT_NAME[SKILLS[k].cat]}</span><small>${SKILLS[k].lv} 级时由师父传授 · ${SKILLS[k].desc}</small></div></div>`).join('');
  const hiddenCount = Object.keys(HIDDEN_SKILLS).filter(k => !P.skills.includes(k)).length;
  const hiddenRows = hiddenCount
    ? `<div class="divider"></div><p><b>隐世武学</b></p><div class="list-row"><div class="grow"><b>？？？？</b><small>江湖五十五处，藏着 ${hiddenCount} 部无人知晓的绝学……游历四方，机缘自现。</small></div></div>`
    : '';

  modal(`武学 · ${s.name}`,
    `<p class="muted" style="margin-bottom:6px">门派心法：<b>${s.passive.text}</b>　已习得 ${P.skills.length - 1} 门 · 每门武学五式招法，主动招式战斗中施展，被动招式运功即生效。</p>
     <div class="divider"></div><p><b>运功之中</b></p>
     ${slotRow('主套路', P.rtSkill)}${slotRow('副套路', P.rtSkill2)}${slotRow('内功', P.inSkill)}${slotRow('轻功', P.agSkill)}
     <div class="divider"></div><p><b>套路武学</b> <span class="muted">（攻伐招式为主，可运功两门）</span></p>${catRows('rt') || '<p class="muted">尚无。</p>'}
     <div class="divider"></div><p><b>内功武学</b> <span class="muted">（被动增益为主，附疗伤/吸星之法）</span></p>${catRows('in') || '<p class="muted">尚无。</p>'}
     <div class="divider"></div><p><b>轻功武学</b> <span class="muted">（身法闪避为主，附凌空迅击）</span></p>${catRows('ag') || '<p class="muted">尚无。</p>'}
     ${future ? `<div class="divider"></div><p><b>门派深造</b></p>${future}` : ''}${hiddenRows}`,
    [{ label: '关闭', fn: null }, { label: '招式在心', primary: true }]);

  $('#modal-root').querySelectorAll('[data-wear]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.wear, sk = SKILLS[id];
    const slot = forceEquip(id);
    recompute(); save();
    Sfx.click();
    toast(`「${sk.name}」已运于${slot}之位。`);
    closeModal(); renderStatus(); openSkills();
  }));
}

function openMap() {
  const regionHtml = Object.entries(REGIONS).map(([rid, reg]) => {

      const unlocked = P.lv >= m.lv - 6;

      return `<div class="list-row" style="${here ? 'background:rgba(166,58,46,.08)' : ''}">
        <div class="grow"><b>${m.name}</b> ${here ? '<span class="tag">在此</span>' : ''}${m.ch ? '<span class="tag red">主线</span>' : ''}${bossDone ? '<span class="tag">已平定</span>' : ''}
